<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Meals">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Ingredients</title>
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="ingredients.js"></script>
  </head>
  <body>
    <nav class="sidebar" aria-label="Sections">
      <div class="sidebar-header">
        <img class="app-icon" src="/icons/favicon.svg" alt="" width="28" height="28">
        <span class="app-name">Meals</span>
        <button type="button" class="hide-sidebar icon-button" aria-label="Hide sidebar">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="5" width="17" height="14" rx="3.5"/><path d="M9.5 5v14"/></svg>
        </button>
      </div>
      <ul class="page-links">
        <li>
          <a class="page-link" href="/">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
            <span class="page-name">Meal plan</span>
            <span class="page-count"></span>
          </a>
        </li>
        <li>
          <a class="page-link" href="/recipes.html">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 5.5a2 2 0 0 1 2-2h12v14H7a2 2 0 0 0-2 2z"/><path d="M5 19.5a2 2 0 0 0 2 2h12v-4"/></svg>
            <span class="page-name">Recipes</span>
            <span class="page-count" data-count="recipes"></span>
          </a>
        </li>
        <li>
          <a class="page-link" href="/ingredients.html" aria-current="page">
            <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15"/><path d="M5 19l7-7"/></svg>
            <span class="page-name">Ingredients</span>
            <span class="page-count" data-count="ingredients"></span>
          </a>
        </li>
      </ul>
    </nav>

    <header class="toolbar">
      <button type="button" class="show-sidebar glass icon-button" aria-label="Show sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="5" width="17" height="14" rx="3.5"/><path d="M9.5 5v14"/></svg>
      </button>
      <span class="toolbar-spacer"></span>
      <button type="button" id="new-ingredient" class="tint-button">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>
        <span class="button-text">New ingredient</span>
      </button>
    </header>

    <div class="page">
      <h1 class="page-title">Ingredients <span class="title-count" data-count="ingredients"></span></h1>

      <div id="load-error" class="load-error" role="alert" hidden>
        <span>Couldn't load the ingredients.</span>
        <button type="button" id="retry-load">Retry</button>
      </div>

      <main id="ingredient-catalog" class="catalog" hidden>
        <div class="search-field">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
          <label class="visually-hidden" for="search">Search</label>
          <input id="search" type="search" autocomplete="off" placeholder="Search">
        </div>

        <p id="empty-catalog" class="hint" hidden>No ingredients yet. Add your first one with New ingredient.</p>
        <p id="no-matches" class="hint" hidden></p>
        <ul id="active-ingredients" class="catalog-list" aria-label="Ingredients"></ul>

        <details id="archived" class="archived" hidden>
          <summary>
            Archived <span id="archived-count" class="archived-count">0</span>
            <svg class="disclosure" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 5l7 7-7 7"/></svg>
          </summary>
          <ul id="archived-ingredients" class="catalog-list" aria-label="Archived ingredients"></ul>
        </details>
      </main>
    </div>

    <!-- Ingredient editor. Filled and opened by ingredient-editor.js. -->
    <dialog id="ingredient-editor" class="dialog" aria-labelledby="ingredient-editor-title">
      <div class="dialog-body">
        <header class="sheet-header">
          <button type="button" class="cancel">Cancel</button>
          <div class="sheet-heading">
            <h2 id="ingredient-editor-title" class="dialog-title" tabindex="-1">Edit ingredient</h2>
          </div>
          <button type="button" class="done primary">Done</button>
        </header>
        <div class="sheet-content">
          <label class="section-title" for="ingredient-name">Name</label>
          <input id="ingredient-name" class="name-field" type="text" autocomplete="off" placeholder="Ingredient name">
          <p class="field-message name-message" role="status"></p>
          <fieldset id="ingredient-unit" class="unit-field">
            <legend class="section-title">Unit</legend>
            <div class="segmented">
              <label><input type="radio" name="unit" value="g"><span>g</span></label>
              <label><input type="radio" name="unit" value="ml"><span>ml</span></label>
              <label><input type="radio" name="unit" value="pcs"><span>pcs</span></label>
            </div>
          </fieldset>
          <div class="conversion" hidden>
            <h3 class="section-title">Conversion</h3>
            <div class="card">
              <div class="conversion-line">
                <input class="conversion-from quantity-field" type="text" inputmode="decimal" autocomplete="off" aria-label="Amount in the old unit">
                <span class="conversion-from-unit"></span>
                <span class="equals">=</span>
                <input class="conversion-to quantity-field" type="text" inputmode="decimal" autocomplete="off" aria-label="Amount in the new unit">
                <span class="conversion-to-unit"></span>
              </div>
              <label class="conversion-measure" hidden>
                <span class="conversion-measure-label">Saved as measure</span>
                <input class="conversion-measure-name" type="text" autocomplete="off">
              </label>
            </div>
            <p class="field-message conversion-message" role="status"></p>
          </div>
          <h3 class="section-title">Measures</h3>
          <div class="card">
            <ul class="measure-rows ingredient-rows" aria-label="Measures"></ul>
            <button type="button" class="add-measure">
              <span class="add-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>
              </span>
              Add measure
            </button>
          </div>
          <p class="field-message save-message" role="status"></p>
          <button type="button" class="archive" hidden>Archive</button>
        </div>
      </div>
    </dialog>
  </body>
</html>
