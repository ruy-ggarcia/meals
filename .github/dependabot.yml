# The commit prefixes decide what reaches production: release-please turns
# fix commits into a patch release, and ignores build and ci commits.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      include: scope
    groups:
      docker:
        update-types: [minor, patch]
    ignore:
      # A new major version of Node.js changes the image and the CI workflow
      # together, by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: fix
      prefix-development: build
      include: scope
    # One group per dependency type, so a development update never shares a
    # fix commit with a production update and never cuts a release.
    groups:
      # Before npm-development, because a dependency joins the first group
      # that matches. The browser test tools bring new browsers and new axe
      # rules, so an update that breaks the browser tests doesn't hold back
      # the other development updates.
      browser-tests:
        dependency-type: development
        patterns: ["@axe-core/playwright", "@playwright/test"]
        update-types: [minor, patch]
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
