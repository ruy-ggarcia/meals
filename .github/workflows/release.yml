name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # A token of the GitHub App, so the release pull request runs the
      # required checks. Pull requests opened with GITHUB_TOKEN don't.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
      # release-please reads the pull request title in the body of each merge
      # commit as one more change, and the GitHub Release takes its notes from
      # the body of the release pull request. These steps remove those entries
      # from CHANGELOG.md and from the body each time release-please updates
      # them. The app token pushes the cleaned commit, so the required checks
      # run on it. The cleaned body never matches the one that release-please
      # builds, so release-please updates the pull request on every push to
      # main.
      - if: steps.release.outputs.prs_created == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ steps.app-token.outputs.token }}
      - if: steps.release.outputs.prs_created == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Remove the merge commit entries from the changelog
        if: steps.release.outputs.prs_created == 'true'
        env:
          BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          node scripts/clean-release-notes.js < CHANGELOG.md > "$RUNNER_TEMP/CHANGELOG.md"
          if ! cmp -s CHANGELOG.md "$RUNNER_TEMP/CHANGELOG.md"; then
            mv "$RUNNER_TEMP/CHANGELOG.md" CHANGELOG.md
            # The author of release-please's commit commits the amended one too.
            GIT_COMMITTER_NAME="$(git log -1 --format=%an)" \
              GIT_COMMITTER_EMAIL="$(git log -1 --format=%ae)" \
              git commit --all --amend --no-edit
            git push --force-with-lease="$BRANCH" origin "HEAD:$BRANCH"
          fi
      - name: Remove the merge commit entries from the pull request
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ fromJSON(steps.release.outputs.pr).number }}
        run: |
          gh pr view "$PR" --json body --jq .body > "$RUNNER_TEMP/body.md"
          node scripts/clean-release-notes.js < "$RUNNER_TEMP/body.md" > "$RUNNER_TEMP/clean-body.md"
          if ! cmp -s "$RUNNER_TEMP/body.md" "$RUNNER_TEMP/clean-body.md"; then
            gh pr edit "$PR" --body-file "$RUNNER_TEMP/clean-body.md"
          fi

  publish:
    name: publish
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/ruy-ggarcia/meals
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Check that the tag matches package.json
        run: test "$TAG" = "v$(jq -r .version package.json)"
      - name: Build the image
        run: >-
          docker build
          --build-arg "REVISION=$(git rev-parse HEAD)"
          --build-arg "VERSION=$VERSION"
          --tag "$IMAGE:$VERSION" .
      - name: Run the smoke test
        run: scripts/image-smoke.sh "$IMAGE:$VERSION"
      # Pushes the image that passed the smoke test, not a rebuild.
      - name: Push the image
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$VERSION"
          # Picks the GHCR digest: the image can have other repository digests.
          docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$IMAGE:$VERSION" \
            | grep -Ex 'ghcr\.io/ruy-ggarcia/meals@sha256:[0-9a-f]{64}' > image.txt
          # The host reads exactly one image reference.
          test "$(wc -l < image.txt)" -eq 1
      - name: Attach image.txt to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" image.txt
